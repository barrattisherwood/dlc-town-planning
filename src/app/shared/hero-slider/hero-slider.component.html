<section class="relative overflow-hidden" style="height: calc(100vh - 6rem);">
  <!-- Slides -->
  <div class="relative h-full">
    @for (slide of slides; track $index) {
      <div 
        class="absolute inset-0 transition-opacity duration-1000 ease-in-out"
        [class.opacity-100]="currentSlide() === $index"
        [class.opacity-0]="currentSlide() !== $index"
        [class.z-10]="currentSlide() === $index"
        [class.z-0]="currentSlide() !== $index"
      >
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 z-0">
          <img [src]="slide.image" [alt]="slide.title" class="w-full h-full object-cover" loading="eager" />
          <div class="absolute inset-0 bg-gradient-to-r from-black/70 via-black/50 to-black/30 z-10"></div>
        </div>

        <!-- Content -->
        <div class="relative h-full flex items-center z-20">
          <div class="container-custom">
            <div class="max-w-4xl">
              <h1 class="hero-title text-5xl md:text-6xl lg:text-7xl font-bold mb-6">
                {{ slide.title }}<br>
                <span class="text-teal-light" style="text-shadow: 2px 2px 8px rgba(0,0,0,0.8);">{{ slide.subtitle }}</span>
              </h1>
              <p class="hero-description text-xl md:text-2xl mb-10 max-w-2xl">
                {{ slide.description }}
              </p>
              <div class="flex flex-col sm:flex-row gap-4">
                <a routerLink="/projects" class="btn btn-primary text-lg px-8 py-4">
                  View Our Projects
                </a>
                <a routerLink="/contact" class="btn btn-outline text-lg px-8 py-4 border-white text-white hover:bg-white hover:text-navy">
                  Get in Touch
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Navigation Arrows -->
  <button
    (click)="previousSlide()"
    class="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 z-30 bg-white/20 hover:bg-white/30 backdrop-blur-sm text-white p-3 rounded-full transition-all"
    aria-label="Previous slide"
  >
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
    </svg>
  </button>
  
  <button
    (click)="nextSlide()"
    class="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 z-30 bg-white/20 hover:bg-white/30 backdrop-blur-sm text-white p-3 rounded-full transition-all"
    aria-label="Next slide"
  >
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
    </svg>
  </button>

    <!-- Line Navigation -->
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-30 flex gap-2 items-end">
      @for (slide of slides; track $index) {
        <div
          role="button"
          tabindex="0"
          (click)="goToSlide($index)"
          (keydown.enter)="goToSlide($index)"
          (keydown.space)="goToSlide($index)"
          [class]="'w-12 transition-all duration-300 cursor-pointer border-b-2 hover:border-white/80 ' + 
                   (currentSlide() === $index ? 'border-teal-light h-1' : 'border-white/40 h-0.5')"
          [attr.aria-label]="'Go to slide ' + ($index + 1)">
        </div>
      }
    </div>
  </section>
