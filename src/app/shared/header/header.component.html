<header class="nav" [class.scrolled]="scrolled()">
  <div class="container-custom">
    <div class="nav-inner">
      <!-- Logo -->
      <a routerLink="/" class="nav-logo">
        <img 
          [src]="scrolled() ? '/assets/images/dlc-logo-dark.png' : '/assets/images/dlc-logo-white.png'"
          alt="DLC Town Planning Logo" 
          height="52"
        />
      </a>

      <!-- Desktop Navigation -->
      <ul class="nav-links">
        @for (item of navItems; track item.path) {
          @if (item.path !== '/') {
            <li>
              <a
                [routerLink]="item.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{exact: false}"
                (click)="closeMobileMenu()"
                [class.nav-cta]="item.label === 'Contact'"
              >
                {{ item.label }}
              </a>
            </li>
          }
        }
      </ul>

      <!-- Mobile menu button -->
      <button
        (click)="toggleMobileMenu()"
        class="hamburger"
        [class.open]="mobileMenuOpen()"
        [attr.aria-label]="mobileMenuOpen() ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="mobileMenuOpen()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Navigation Overlay -->
  <div class="mobile-menu" [class.open]="mobileMenuOpen()">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        (click)="closeMobileMenu()"
        [class.mobile-cta]="item.label === 'Contact'"
      >
        {{ item.label }}
      </a>
    }
  </div>
</header>
