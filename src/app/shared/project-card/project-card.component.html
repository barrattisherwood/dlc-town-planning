<div class="card overflow-hidden hover:shadow-xl transition-shadow">
  <!-- Project Image Placeholder -->
  <div class="h-48 bg-gradient-to-br from-teal/70 to-teal-light/70 flex items-center justify-center">
    <svg class="w-16 h-16 text-white opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
    </svg>
  </div>
  
  <!-- Project Info -->
  <div class="p-6">
    <!-- Category Badge -->
    <span class="inline-block px-3 py-1 bg-teal/10 text-teal text-sm rounded-full mb-3 font-medium">
      {{ project.category }}
    </span>
    
    <!-- Title -->
    <h3 class="text-xl font-bold mb-2">{{ project.title }}</h3>
    
    <!-- Location -->
    <p class="text-muted text-sm mb-3 flex items-center">
      <svg class="w-4 h-4 mr-1 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      {{ project.location }}
    </p>
    
    <!-- Description -->
    <p class="text-muted">{{ project.description }}</p>
    
    <!-- Completion Date if available -->
    @if (project.completionDate) {
      <p class="text-sm text-teal font-medium mt-3">Completed: {{ project.completionDate }}</p>
    }
  </div>
</div>
