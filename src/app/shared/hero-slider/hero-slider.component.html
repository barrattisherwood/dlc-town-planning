<section class="relative h-screen overflow-hidden">
  <!-- Slides -->
  <div class="relative h-full">
    @for (slide of slides; track $index) {
      <div 
        class="absolute inset-0 transition-opacity duration-1000 ease-in-out"
        [class.opacity-100]="currentSlide() === $index"
        [class.opacity-0]="currentSlide() !== $index"
        [class.z-10]="currentSlide() === $index"
        [class.z-0]="currentSlide() !== $index"
      >
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 z-0">
          <img [src]="slide.image" [alt]="slide.title" class="w-full h-full object-cover" loading="eager" />
          <div class="absolute inset-0 bg-black/40 z-10"></div>
        </div>

        <!-- Content -->
        <div class="relative h-full flex items-center z-20">
          <div class="container-custom">
            <div class="max-w-4xl text-white">
              <h1 class="text-5xl md:text-6xl lg:text-7xl font-bold mb-6">
                {{ slide.title }}<br>
                <span class="text-teal-light">{{ slide.subtitle }}</span>
              </h1>
              <p class="text-xl md:text-2xl mb-10 text-gray-200 max-w-2xl">
                {{ slide.description }}
              </p>
              <div class="flex flex-col sm:flex-row gap-4">
                <a routerLink="/projects" class="btn btn-primary text-lg px-8 py-4">
                  View Our Projects
                </a>
                <a routerLink="/contact" class="btn btn-outline text-lg px-8 py-4 border-white text-white hover:bg-white hover:text-navy">
                  Get in Touch
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Navigation Arrows -->
  <button
    (click)="previousSlide()"
    class="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 z-30 bg-white/20 hover:bg-white/30 backdrop-blur-sm text-white p-3 rounded-full transition-all"
    aria-label="Previous slide"
  >
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
    </svg>
  </button>
  
  <button
    (click)="nextSlide()"
    class="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 z-30 bg-white/20 hover:bg-white/30 backdrop-blur-sm text-white p-3 rounded-full transition-all"
    aria-label="Next slide"
  >
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
    </svg>
  </button>

  <!-- Dots Navigation -->
  <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-30 flex gap-3">
    @for (slide of slides; track $index) {
      <button
        (click)="goToSlide($index)"
        class="w-3 h-3 rounded-full transition-all duration-300"
        [class.bg-white]="currentSlide() === $index"
        [class.w-8]="currentSlide() === $index"
        [class.bg-white/50]="currentSlide() !== $index"
        [attr.aria-label]="'Go to slide ' + ($index + 1)"
      >
      </button>
    }
  </div>
</section>
