<header class="bg-white shadow-md sticky top-0 z-50 border-b border-warm-grey">
  <nav class="container-custom">
    <div class="flex items-center justify-between h-24 py-2">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center py-2">
        <img src="/assets/images/dlclogo3.jpg" alt="DLC Town Planning Logo" class="h-20 w-auto object-contain" />
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-8">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="text-teal border-b-2 border-teal"
            [routerLinkActiveOptions]="{exact: item.path === '/'}"
            class="text-navy hover:text-teal transition-colors py-2 font-semibold"
          >
            {{ item.label }}
          </a>
        }
      </div>

      <!-- Mobile menu button -->
      <button
        (click)="toggleMobileMenu()"
        class="md:hidden text-navy p-2 hover:bg-off-white rounded-md transition-colors"
        [attr.aria-label]="mobileMenuOpen() ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="mobileMenuOpen()"
      >
        @if (!mobileMenuOpen()) {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        } @else {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        }
      </button>
    </div>

    <!-- Mobile Navigation -->
    @if (mobileMenuOpen()) {
      <div class="md:hidden py-4 border-t border-warm-grey bg-off-white">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-teal text-white"
            [routerLinkActiveOptions]="{exact: item.path === '/'}"
            (click)="closeMobileMenu()"
            class="block text-navy hover:bg-teal hover:text-white px-4 py-3 rounded-md transition-colors font-semibold"
          >
            {{ item.label }}
          </a>
        }
      </div>
    }
  </nav>
</header>
