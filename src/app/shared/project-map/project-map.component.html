<div class="w-full h-full relative">
  <!-- Leaflet Map Container -->
  <div id="project-map" class="w-full h-full"></div>

  <!-- Map Legend -->
  <div class="absolute top-4 right-4 bg-white rounded-lg shadow-lg p-4 max-w-xs z-[1000]">
    <h4 class="font-heading font-semibold text-navy mb-2 text-sm">Project Locations</h4>
    <div class="space-y-1 text-xs text-muted">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-teal"></div>
        <span>{{ projectCount() }} Projects mapped</span>
      </div>
      @if (boundaryCount() > 0) {
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 bg-teal/20 border-2 border-teal"></div>
          <span>{{ boundaryCount() }} boundaries shown</span>
        </div>
      }
    </div>
  </div>
</div>
