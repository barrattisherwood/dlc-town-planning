<a [routerLink]="['/projects', project.slug || project.id]" class="block no-underline text-inherit">
<div class="card overflow-hidden hover:shadow-2xl transition-all duration-300 border-2 border-transparent hover:border-teal/20 hover:-translate-y-1 group cursor-pointer">
  <!-- Project Image -->
  @if (project.image) {
    <div class="h-56 overflow-hidden relative">
      <img 
        [src]="project.image" 
        [alt]="project.title"
        class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
        (error)="onImageError($event)"
      />
      <!-- Overlay on hover -->
      <div class="absolute inset-0 bg-gradient-to-t from-navy/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
    </div>
  } @else {
    <!-- No Image Placeholder -->
    <div class="h-56 relative overflow-hidden project-card-placeholder">
      <img
        src="/assets/images/dlc-logo-dark.png"
        alt=""
        class="absolute inset-0 w-full h-full object-contain p-8 opacity-[0.12] scale-125 rotate-[-8deg] pointer-events-none select-none"
        aria-hidden="true"
      />
      <div class="absolute bottom-0 left-0 right-0 h-1/3 bg-gradient-to-t from-black/30 to-transparent"></div>
    </div>
  }
  
  <!-- Project Info -->
  <div class="p-6">
    <!-- Category Badge -->
    <span class="inline-block px-4 py-1.5 bg-gradient-to-r from-teal/10 to-teal-light/10 text-teal text-sm rounded-full mb-4 font-semibold border border-teal/20">
      {{ project.category }}
    </span>
    
    <!-- Title -->
    <h3 class="text-xl font-bold mb-3 text-navy group-hover:text-teal transition-colors">{{ project.title }}</h3>
    
    <!-- Location -->
    <p class="text-muted text-sm mb-4 flex items-center font-medium">
      <svg class="w-4 h-4 mr-1.5 inline text-teal" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      {{ project.location }}
    </p>
    
    <!-- Description -->
    <p class="text-muted leading-relaxed text-sm">{{ project.description }}</p>
    
    <!-- Completion Date if available -->
    @if (project.completionDate) {
      <div class="mt-4 pt-4 border-t border-gray-100">
        <p class="text-sm text-teal font-semibold flex items-center">
          <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Completed: {{ project.completionDate }}
        </p>
      </div>
    }
  </div>
</div>
</a>
