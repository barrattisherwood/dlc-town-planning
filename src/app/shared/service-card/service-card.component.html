<a
  [routerLink]="['/services', service.slug]"
  class="card p-8 hover:shadow-2xl transition-all duration-300 group block border-2 border-transparent hover:border-teal hover:-translate-y-2 bg-white"
>
  <!-- Icon -->
  <div class="w-20 h-20 mb-6 bg-gradient-to-br from-navy/10 to-teal/10 rounded-2xl flex items-center justify-center group-hover:from-navy group-hover:to-navy group-hover:scale-110 transition-all duration-300 shadow-md group-hover:shadow-lg">
    @if (service.icon === 'land') {
      <!-- Land Use Planning - Map/Grid Icon -->
      <svg class="w-10 h-10 text-navy group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
      </svg>
    } @else if (service.icon === 'township') {
      <!-- Township Establishment - Buildings Icon -->
      <svg class="w-10 h-10 text-navy group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
      </svg>
    } @else if (service.icon === 'environment') {
      <!-- Environmental Planning - Globe/Nature Icon -->
      <svg class="w-10 h-10 text-navy group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    } @else {
      <!-- Default Icon -->
      <svg class="w-10 h-10 text-navy group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
    }
  </div>

  <!-- Content -->
  <h3 class="text-xl mb-4 text-navy group-hover:text-teal transition-colors font-bold">{{ service.title }}</h3>
  <p class="text-muted mb-6 leading-relaxed text-base">{{ service.summary }}</p>

  <!-- Learn More -->
  <span class="text-teal font-semibold flex items-center group-hover:gap-2 transition-all text-base">
    Learn More
    <svg class="w-5 h-5 ml-1 group-hover:translate-x-2 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
    </svg>
  </span>
</a>
